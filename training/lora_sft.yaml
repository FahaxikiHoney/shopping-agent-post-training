model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
dataset: shopping_train
dataset_dir: sft_data/ready_to_run/chatml
template: qwen
cutoff_len: 2048
max_samples: 1297
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
eval_dataset: shopping_validation
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200
output_dir: ./output/shopping-agent-lora
logging_steps: 20
save_steps: 500
save_total_limit: 3
gradient_checkpointing: true
optim: adamw_torch
dataloader_num_workers: 0
